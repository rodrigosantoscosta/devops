name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  attestations: write
  id-token: write

# Desafio 22min: cancela runs antigos do mesmo ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar
        run: mvn -B clean compile

  unit-tests:
    name: Unit Tests
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Testes unitarios (Surefire - *Test.java)
        run: mvn -B test

      - name: Publicar relatorios Surefire (diagnostico apenas se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ github.sha }}
          path: target/surefire-reports/
          retention-days: 3

  integration-tests:
    name: Integration Tests
    # P3 split PR vs main: IT so roda em push para main (feedback rapido no PR)
    # PR valida compile + unit (~2-3min); main valida completo (~7-8min)
    if: github.event_name == 'push'
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Testes de integracao (Failsafe - *IT.java)
        run: mvn -B verify

      - name: Publicar relatorios Failsafe (diagnostico apenas se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports-${{ github.sha }}
          path: target/failsafe-reports/
          retention-days: 3

  package:
    name: Package & Publish
    # So publicavel em push para main, apos todos os testes verdes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [unit-tests, integration-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Gerar JAR (so apos testes verdes - sem -DskipTests)
        run: mvn -B package

      - name: Registrar commit no artefato (rastreabilidade)
        run: |
          echo "${{ github.sha }}" > target/commit.txt
          echo "Commit: ${{ github.sha }}" >> target/commit.txt
          echo "Run: ${{ github.run_id }}-${{ github.run_number }}" >> target/commit.txt
          echo "Ref: ${{ github.ref }}" >> target/commit.txt
          echo "Event: ${{ github.event_name }}" >> target/commit.txt
          cat target/commit.txt

      - name: Publicar artefato versionado por commit
        uses: actions/upload-artifact@v4
        with:
          name: api-${{ github.sha }}
          path: target/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Attest provenance (apenas em main - garante JAR veio da CI)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'target/*.jar'
